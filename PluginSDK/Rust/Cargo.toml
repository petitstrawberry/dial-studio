[package]
name = "dial-plugin-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Plugin API for Dial Studio WebAssembly actions"
repository = "https://github.com/petitstrawberry/dial-studio"
readme = "README.md"
keywords = ["dial-studio", "plugin", "webassembly"]
categories = ["wasm", "development-tools"]
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
